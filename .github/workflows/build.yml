name: Build
on:
  push:
  pull_request:
    types: [ opened, synchronize, reopened ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Docker image
        run: docker build -t ghcr.io/noahvdaa/kijkbuis:latest -t ghcr.io/noahvdaa/kijkbuis:${{ github.ref_name }}-${{ github.sha }}-$(date +%s) .
      - name: Push Docker image
        run: docker push ghcr.io/noahvdaa/kijkbuis -a
        # Only push if we're on master
        if: github.ref == 'refs/heads/master' && github.repository == 'NoahvdAa/Kijkbuis'
